
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora Matemática</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #resultado {
            margin-top: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .error {
            color: red;
        }

        .correcto {
            color: green;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Calculadora</h1>

        <form id="formulario">

            <label for="numero1">Primer número:</label>

            <input
                type="number"
                id="numero1"
                min="-99999"
                max="99999"
                step="1"
                required
            >

            <label for="operacion">Selecciona una operación:</label>

            <select id="operacion">
                <option value="suma">Suma (+)</option>
                <option value="resta">Resta (-)</option>
                <option value="multiplicacion">Multiplicación (×)</option>
                <option value="potencia">Potencia (^)</option>
            </select>

            <label for="numero2">Segundo número:</label>

            <input
                type="number"
                id="numero2"
                min="-99999"
                max="99999"
                step="1"
                required
            >

            <button type="submit">Calcular</button>

        </form>

        <p id="resultado">Aquí aparecerá el resultado.</p>

    </div>

    <script>

        const formulario = document.getElementById("formulario");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();

            const numero1 = document.getElementById("numero1").value;
            const numero2 = document.getElementById("numero2").value;
            const operacion = document.getElementById("operacion").value;

            resultado.className = "";
            resultado.textContent = "Calculando...";

            try {

                const respuesta = await fetch("/api/calcular", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },

                    body: new URLSearchParams({
                        numero1: numero1,
                        numero2: numero2,
                        operacion: operacion
                    })
                });

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(datos.error);
                }

                resultado.className = "correcto";
                resultado.textContent = "Resultado: " + datos.resultado;

            } catch (error) {

                resultado.className = "error";
                resultado.textContent = "Error: " + error.message;

            }

        });

    </script>

</body>
</html>
